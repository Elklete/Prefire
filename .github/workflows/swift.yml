# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Run ${{ matrix.xcode }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_16.4"
            runsOn: macos-15
          - xcode: "Xcode_26.4"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v6
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app

      # The generator's source dependencies are shared by the CLI, plugins, and generator tests.
      - name: Cache root package build
        uses: actions/cache@v4
        with:
          path: .build
          key: root-package-${{ matrix.xcode }}-${{ hashFiles('Package.resolved') }}
          restore-keys: root-package-${{ matrix.xcode }}-

      - name: Validate source-only package graph
        run: make package-validate

      # SnapshotTesting brings swift-syntax along, which takes long to clone.
      - name: Cache iOS test packages
        uses: actions/cache@v4
        with:
          path: PrefireSnapshotTests/.build/SourcePackages
          key: ios-test-packages-${{ matrix.xcode }}-${{ hashFiles('PrefireSnapshotTests/Package.resolved') }}
          restore-keys: ios-test-packages-${{ matrix.xcode }}-
        
      - name: Build Prefire
        run: make build

      - name: Run Prefire macOS Tests
        run: make test

      - name: Run source-built plugin integration fixture
        run: make integration

      # Services the tests do not use are turned off before xcodebuild boots the simulator,
      # which then boots and starts the tests sooner.
      - name: Run Prefire iOS Tests
        run: make slim-sim test-ios

      - name: Build source-backed prefire CLI
        run: make cli

      - name: Smoke test source-backed prefire CLI
        run: |
          set -euo pipefail
          bin=$(pwd)/.build/release/prefire
          $bin --version
          for command in tests playbook render board mcp; do
            $bin "$command" --help >/dev/null
          done
