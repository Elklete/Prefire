name: Signed source release

on:
  push:
    tags: ['prefire-v*']

permissions:
  contents: write
  security-events: write

concurrency:
  group: prefire-source-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify signed tag and publish source + SBOM
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a protected release tag
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: test "$REF_PROTECTED" = true
      - name: Verify the approved signing key
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.PREFIRE_RELEASE_SIGNING_PUBLIC_KEY }}
          PREFIRE_RELEASE_SIGNING_FINGERPRINT: ${{ vars.PREFIRE_RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_PUBLIC_KEY"
          printf '%s\n' "$RELEASE_SIGNING_PUBLIC_KEY" | gpg --batch --import
          Scripts/verify-release-tag.sh "$GITHUB_REF_NAME"
      - name: Select the supported Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Start from a clean package state
        run: swift package reset
      - name: Validate locks and tracked delivery surfaces
        run: make audit
      - uses: github/codeql-action/init@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          languages: swift
          build-mode: manual
      - name: Build every root source target
        run: swift build
      - name: Run generator unit tests
        run: swift test --skip PluginFixtureTests
      - name: Build and run both source-built plugin fixtures
        run: swift test --filter PluginFixtureTests
      - name: Compile the retained iOS snapshot fixture
        working-directory: PrefireSnapshotTests
        run: xcodebuild -scheme PrefireSnapshotTests-Package -destination 'generic/platform=iOS Simulator' build-for-testing
      - name: Compile the retained example plugin fixture
        working-directory: Example
        run: xcodebuild -project PreFireExample.xcodeproj -scheme PrefireExample -destination 'generic/platform=iOS Simulator' build-for-testing
      - uses: github/codeql-action/analyze@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
      - name: Generate SPDX SBOM from source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: prefire-sbom.spdx.json
      - name: Fail on High or Critical advisories
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: prefire-sbom.spdx.json
          fail-build: true
          severity-cutoff: high
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish source release and SBOM only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" prefire-sbom.spdx.json --title "$GITHUB_REF_NAME" --generate-notes
